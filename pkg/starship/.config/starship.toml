# Based on: https://github.com/catppuccin/starship/blob/5906cc369dd8207e063c0e6e2d27bd0c0b567cb8/starship.toml
# Merged together with the nerd font symbols preset and the bracketed segments preset.
# Merging was done with an online toml merger, so this now looks horrible.

"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"

[character]
success_symbol = "[[󰄛](green) ❯](peach)"
error_symbol = "[[󰄛](red) ❯](peach)"
